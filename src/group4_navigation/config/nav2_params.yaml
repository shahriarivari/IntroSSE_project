# Nav2 (ROS 2 Jazzy) for robot_4: iRobot Create 3, radius 0.17 m, max ~0.306 m/s, group 4 arena.
# Map + map->odom come from slam_toolbox, which keeps running in round 2.
# Node keys are plain names; navigation.launch.py puts them under the namespace (robot_4).
# Topics outside Nav2 (odom, scan, map) are written absolute so there is no doubt where they go.
# odom: Nav2 reads /robot_4/odom_reliable (odom_relay in navigation.launch.py), because the
# Create 3 publishes /robot_4/odom best-effort and Nav2 subscribes reliable.

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /robot_4/odom_reliable   # via odom_relay (Create 3 odom is best-effort)
    controller_frequency: 10.0          # Pi CPU: 10 Hz is plenty; velocity_smoother sends at 20 Hz
    enable_stamped_cmd_vel: false       # Create 3 takes geometry_msgs/Twist (like the Bug2 node)
    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15           # same as Bug2's GOAL_TOLERANCE
      yaw_goal_tolerance: 3.14          # we only care about reaching the spot, not the heading

    FollowPath:
      # Regulated Pure Pursuit: follows the planned path closely, slows down in sharp turns
      # and near walls (the ~50 cm gaps), turns in place first when the path points away.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25          # Create 3 max ~0.306 m/s (same max as Bug2's MAX_V)
      # ---- lookahead (carrot) ----
      lookahead_dist: 0.4
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.7
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      # ---- slowing down ----
      use_regulated_linear_velocity_scaling: true   # sharp turns
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.08
      use_cost_regulated_linear_velocity_scaling: true   # close to walls
      cost_scaling_dist: 0.2            # must be <= inflation_radius (0.25)
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 6.0   # = inflation_layer cost_scaling_factor (keep in sync)
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      # ---- turning ----
      use_rotate_to_heading: true       # turn in place when the path is > 45 deg off
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 3.0
      allow_reversing: false            # must be false with use_rotate_to_heading
      # ---- safety / misc ----
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      transform_tolerance: 0.3
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.5
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.17
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /robot_4/scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25          # gaps are ~50 cm: the default 0.55 makes every gap "expensive"
        cost_scaling_factor: 6.0        # = RPP inflation_cost_scaling_factor (keep in sync)
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.5
      robot_radius: 0.17
      resolution: 0.05                  # same as the SLAM map
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /robot_4/map
        map_subscribe_transient_local: true   # slam_toolbox publishes the map latched
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /robot_4/scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
        cost_scaling_factor: 6.0        # = RPP inflation_cost_scaling_factor (keep in sync)
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3                    # goal in/at a wall: plan to the nearest free spot within 0.3 m
      use_astar: true
      allow_unknown: false              # only plan through what was actually seen in round 1

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    transform_tolerance: 0.5
    cycle_frequency: 10.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /robot_4/odom_reliable   # via odom_relay (Create 3 odom is best-effort)
    transform_tolerance: 0.5
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

velocity_smoother:
  ros__parameters:
    # Between controller/behaviors (cmd_vel_nav) and the collision monitor (cmd_vel_smoothed):
    # limits the acceleration, so the Create 3 doesn't jerk. Remaps in navigation.launch.py.
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"               # use the last command, not odom (odom lags over the Pi)
    max_velocity: [0.25, 0.0, 1.2]      # [x, y, theta]: >= what RPP/behaviors ask
    min_velocity: [-0.25, 0.0, -1.2]
    max_accel: [0.8, 0.0, 2.5]          # [m/s^2, -, rad/s^2]
    max_decel: [-1.0, 0.0, -3.0]        # braking a bit harder than speeding up
    odom_topic: /robot_4/odom_reliable   # via odom_relay (Create 3 odom is best-effort)
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0               # no command for 1 s -> send zero once, then silent
    enable_stamped_cmd_vel: false       # Create 3 takes geometry_msgs/Twist

collision_monitor:
  ros__parameters:
    # Last step before the robot: cmd_vel_smoothed -> (check against the live scan) -> cmd_vel.
    # Independent of the costmaps/planner: catches what they missed (e.g. a moved box).
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed  # relative -> /robot_4/cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel          # relative -> /robot_4/cmd_vel (the robot)
    state_topic: collision_monitor_state
    enable_stamped_cmd_vel: false       # Create 3 takes geometry_msgs/Twist
    transform_tolerance: 0.3
    source_timeout: 1.0                 # scan older than this -> robot stops
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # Only "approach": slow down/stop so the footprint never reaches a scan point within
    # time_before_collision. It only looks where the robot is going, so driving through the
    # ~50 cm gaps (8 cm each side) and turning in place near a wall still work. A fixed
    # stop zone around the robot would freeze it there. To switch it off: enabled: false.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: local_costmap/published_footprint   # robot_radius 0.17 circle
      time_before_collision: 1.2        # [s]
      simulation_time_step: 0.1
      min_points: 4                     # ignore 1-3 noise points
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: scan
      topic: /robot_4/scan
      enabled: true
